<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小炒王</title>
<style>
:root{--bg:#fff9f2;--card:#ffffff;--ink:#3a2e24;--muted:#8a7565;--acc:#c96f2e;--acc-d:#a8561f;--line:#f0e2d2}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Noto Sans TC","PingFang HK","Microsoft JhengHei",sans-serif;line-height:1.75;font-size:18px;padding-bottom:60px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
header.hero{padding:38px 18px 26px;text-align:center}
header.hero h1{font-size:30px;letter-spacing:2px;margin-bottom:6px}
header.hero p{color:var(--muted);font-size:15px}
.back{display:inline-block;margin:22px 0 4px;color:var(--acc);text-decoration:none;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 20px;margin:14px 0;box-shadow:0 2px 8px rgba(150,100,60,.06)}
.card h2{font-size:21px;margin-bottom:8px}
.card h2 a{color:var(--ink);text-decoration:none}
.card h2 a:hover{color:var(--acc)}
.tag{display:inline-block;background:#fbeedf;color:var(--acc-d);font-size:13px;border-radius:20px;padding:2px 12px;margin:4px 6px 4px 0}
.meta{color:var(--muted);font-size:14px;margin-top:6px}
a{color:var(--acc)}
h1.title{font-size:26px;margin:18px 0 4px}
h2.sec{font-size:20px;margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
ul,ol{padding-left:24px;margin:8px 0}
li{margin:6px 0}
blockquote{border-left:4px solid var(--acc);background:#fff;padding:10px 16px;margin:14px 0;border-radius:0 10px 10px 0;color:#5c4a3a}
.bigbtn{display:block;background:var(--acc);color:#fff;text-align:center;font-size:20px;border-radius:14px;padding:18px;margin:14px 0;text-decoration:none}
.bigbtn:hover{background:var(--acc-d)}
.bigbtn small{display:block;font-size:13px;opacity:.85;margin-top:4px}
.src{color:var(--muted);font-size:14px;margin:10px 0}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:40px}
.empty{background:#fdf3e7;border:1px dashed var(--acc);border-radius:14px;padding:26px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap"><a class="back" href="index.html">← 食譜索引</a></div>
<div class="wrap">
<h1 class="title">小炒王</h1><div class="empty">食譜內容待補充，遲啲再寫。</div>
</div>
<footer>Pat Zone</footer>
</body>
</html>
